name: Build installers

# Builds the Mac (.dmg) and Windows (.exe) installers.
# - On every push/dispatch: uploads them as workflow artifacts (download from the run).
# - On a version tag (v*): also publishes a GitHub Release with the installers attached.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            pattern: release/*.dmg
          - os: windows-latest
            platform: win
            pattern: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Playwright is only used by the local E2E script; don't fetch browsers in CI.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer (${{ matrix.platform }})
        run: npm run dist:${{ matrix.platform }}
        env:
          # Code signing + notarization. All optional: with no certs configured
          # the build is UNSIGNED (CSC_IDENTITY_AUTO_DISCOVERY stays false). To get
          # warning-free installs, add these repo secrets (see INSTALL.md):
          #   CSC_LINK                  base64 of the signing cert (.p12) — Mac Developer ID or Windows cert
          #   CSC_KEY_PASSWORD          the .p12 password
          #   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   (Mac notarization)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Sign only when a cert is present; otherwise electron-builder ships unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: converse-${{ matrix.platform }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.pattern }}
